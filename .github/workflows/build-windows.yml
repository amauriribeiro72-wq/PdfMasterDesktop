name: Compilar PDF Master Desktop (Windows)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Baixar Codigo-fonte (Checkout)
      uses: actions/checkout@v4

    - name: Configurar ambiente .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restaurar dependencias NuGet
      run: dotnet restore PdfMaster.Desktop.sln

    - name: Publicar executavel (.NET 8 Self-Contained x64)
      run: |
        dotnet publish src/PdfMaster.App/PdfMaster.App.csproj -c Release -r win-x64 --self-contained true -o publish

    - name: Criar pasta dist e pacote portatil zip
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path dist
        Compress-Archive -Path publish\* -DestinationPath dist\PdfMaster_Windows_Portatil.zip -Force

    - name: Instalar Inno Setup via Chocolatey
      run: |
        choco install innosetup --no-progress -y

    - name: Gerar Instalador (.EXE)
      shell: powershell
      run: |
        # Atualiza a variavel PATH da sessao atual
        $machinePath = [System.Environment]::GetEnvironmentVariable("Path", "Machine")
        $userPath = [System.Environment]::GetEnvironmentVariable("Path", "User")
        $env:Path = "$machinePath;$userPath;$env:Path"

        $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue)?.Source
        if (-not $iscc) {
            $candidates = @(
                "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
                "C:\Program Files\Inno Setup 6\ISCC.exe",
                "C:\ProgramData\chocolatey\bin\iscc.exe",
                "C:\ProgramData\chocolatey\lib\innosetup\tools\ISCC.exe"
            )
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
        }

        if (-not $iscc) {
            Write-Error "ISCC.exe nao foi encontrado nos caminhos padrao."
            exit 1
        }

        Write-Host "Compilador Inno Setup encontrado em: $iscc"
        & $iscc packaging/installer.iss
        if ($LASTEXITCODE -ne 0) {
            Write-Error "Falha na execucao do compilador Inno Setup. Codigo de saida: $LASTEXITCODE"
            exit $LASTEXITCODE
        }

    - name: Disponibilizar Instalador do Windows (.EXE)
      uses: actions/upload-artifact@v4
      with:
        name: PdfMaster-Windows-Instalador
        path: dist/PdfMaster_Windows_Setup.exe
        if-no-files-found: error

    - name: Disponibilizar Versao Portatil (.ZIP)
      uses: actions/upload-artifact@v4
      with:
        name: PdfMaster-Windows-Portatil-Zip
        path: dist/PdfMaster_Windows_Portatil.zip
        if-no-files-found: warn
